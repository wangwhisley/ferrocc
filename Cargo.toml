[package]
name = "ferrocc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
ferrous-opencc = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
chardetng = "0.1"
encoding_rs = "0.8"
regex = "1"
